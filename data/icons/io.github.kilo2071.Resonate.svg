<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <!-- Device body: off-white at top → light grey at bottom (top-lit, Adwaita light palette) -->
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#f6f5f4"/>
      <stop offset="100%" stop-color="#d0cecc"/>
    </linearGradient>

    <!-- Gloss sheen across the top face of the device -->
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="white" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>

    <!-- Soft drop-shadow beneath the device -->
    <filter id="shadow" x="-15%" y="-10%" width="130%" height="135%">
      <feDropShadow dx="0" dy="3" stdDeviation="5"
                    flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!--
    Device body — rounded rect, rx=20 (Adwaita-style physical device)
    stroke gives it a thin rim so it reads on both light and dark backgrounds
  -->
  <rect x="8" y="8" width="112" height="112" rx="20"
        fill="url(#body)" stroke="#c0bdba" stroke-width="1"
        filter="url(#shadow)"/>

  <!-- Gloss sheen: covers the upper ~half of the device face -->
  <rect x="8" y="8" width="112" height="58" rx="20" fill="url(#gloss)"/>

  <!--
    4 × 4 launchpad pad grid
    ─────────────────────────
    Pad size : 18 × 18 px    rx = 3
    Gap      : 4 px
    Margin   : 14 px from each device edge
    Step     : 22 px  (18 + 4)

    X positions : 22  44  66  88      (8 + 14 + n×22)
    Y positions : 22  44  66  88

    Four Adwaita accent colours, arranged so no two adjacent pads
    (horizontally or vertically) share a colour:
      G = #33d17a  (Green 3)
      B = #3584e4  (Blue 3)
      Y = #f6d32d  (Yellow 3)
      R = #e01b24  (Red 3)

      Row 0:  G  B  Y  R
      Row 1:  B  G  R  Y
      Row 2:  Y  R  G  B
      Row 3:  R  Y  B  G
  -->

  <!-- Row 0 -->
  <rect x="22" y="22" width="18" height="18" rx="3" fill="#33d17a"/>
  <rect x="44" y="22" width="18" height="18" rx="3" fill="#3584e4"/>
  <rect x="66" y="22" width="18" height="18" rx="3" fill="#f6d32d"/>
  <rect x="88" y="22" width="18" height="18" rx="3" fill="#e01b24"/>

  <!-- Row 1 -->
  <rect x="22" y="44" width="18" height="18" rx="3" fill="#3584e4"/>
  <rect x="44" y="44" width="18" height="18" rx="3" fill="#33d17a"/>
  <rect x="66" y="44" width="18" height="18" rx="3" fill="#e01b24"/>
  <rect x="88" y="44" width="18" height="18" rx="3" fill="#f6d32d"/>

  <!-- Row 2 -->
  <rect x="22" y="66" width="18" height="18" rx="3" fill="#f6d32d"/>
  <rect x="44" y="66" width="18" height="18" rx="3" fill="#e01b24"/>
  <rect x="66" y="66" width="18" height="18" rx="3" fill="#33d17a"/>
  <rect x="88" y="66" width="18" height="18" rx="3" fill="#3584e4"/>

  <!-- Row 3 -->
  <rect x="22" y="88" width="18" height="18" rx="3" fill="#e01b24"/>
  <rect x="44" y="88" width="18" height="18" rx="3" fill="#f6d32d"/>
  <rect x="66" y="88" width="18" height="18" rx="3" fill="#3584e4"/>
  <rect x="88" y="88" width="18" height="18" rx="3" fill="#33d17a"/>
</svg>
